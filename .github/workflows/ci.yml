name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Install the action's pinned Opengrep for the rule corpus tests
        run: |
          set -euo pipefail
          pin=$(python -c 'import yaml; i = yaml.safe_load(open(".github/actions/enqrypta-opengrep/action.yml"))["inputs"]; print(i["opengrep-version"]["default"], i["opengrep-sha256"]["default"])')
          read -r version sha256 <<< "$pin"
          curl --fail --location --silent --show-error \
            "https://github.com/opengrep/opengrep/releases/download/v${version}/opengrep_manylinux_x86" \
            --output "${RUNNER_TEMP}/opengrep"
          echo "${sha256}  ${RUNNER_TEMP}/opengrep" | sha256sum --check -
          chmod +x "${RUNNER_TEMP}/opengrep"
          echo "OPENGREP_BIN=${RUNNER_TEMP}/opengrep" >> "$GITHUB_ENV"
      - run: pytest

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.7
