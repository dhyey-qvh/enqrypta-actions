      - metavariable-regex: {metavariable: $FN, regex: '(?i)^\\?(random_bytes|openssl_random_pseudo_bytes|sodium_randombytes_buf)$'}
      - metavariable-comparison: {metavariable: $OUT_BYTES, comparison: $OUT_BYTES < 16}
    metadata:
      enqrypta_rule_id: enqrypta.misuse.php.short-random-token
      finding_kind: misuse
      cwe: CWE-331
      algorithm: CSPRNG
      primitive: random
      usage: random
      confidence: 0.85
