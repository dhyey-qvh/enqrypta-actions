  - id: enqrypta.misuse.php.db-tls-verify-disabled
    languages: [php]
    severity: ERROR
    message: The database connection does not verify the server certificate or does not use TLS; set PDO::MYSQL_ATTR_SSL_VERIFY_SERVER_CERT to true or sslmode to verify-full.
    paths:
      exclude: ["wp-includes/", "wp-admin/", "*.blade.php"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "[..., $OPT => $VALUE, ...]"
              - pattern: $PDO->setAttribute($OPT, $VALUE)
              - pattern: $FN($LINK, $OPT, $VALUE)
          - metavariable-regex:
              metavariable: $OPT
              regex: '^\\?(PDO::MYSQL_ATTR_SSL_VERIFY_SERVER_CERT|Pdo\\Mysql::ATTR_SSL_VERIFY_SERVER_CERT|MYSQLI_OPT_SSL_VERIFY_SERVER_CERT)$'
          - metavariable-regex: {metavariable: $VALUE, regex: '(?i)^(false|0)$'}
          - focus-metavariable: $OPT
      - patterns:
          - pattern: $FN(..., $FLAG, ...)
          - metavariable-regex: {metavariable: $FLAG, regex: '^\\?MYSQLI_CLIENT_SSL_DONT_VERIFY_SERVER_CERT$'}
      # Postgres sslmode disable/allow, in config arrays (including env() defaults) and DSNs.
      - patterns:
          - pattern-either:
              - pattern: "[..., 'sslmode' => $MODE, ...]"
              - patterns:
                  - pattern: "[..., 'sslmode' => $ENV($NAME, $MODE), ...]"
                  - metavariable-regex: {metavariable: $ENV, regex: '(?i)^\\?env$'}
          - metavariable-regex: {metavariable: $MODE, regex: '^[''"](disable|allow)[''"]$'}
          - focus-metavariable: $MODE
      - patterns:
          - pattern: '"$DSN"'
          - metavariable-regex: {metavariable: $DSN, regex: '(?i)^pgsql:.*sslmode=(disable|allow)'}
    metadata:
      enqrypta_rule_id: enqrypta.misuse.php.db-tls-verify-disabled
      finding_kind: misuse
      cwe: CWE-295
      algorithm: TLS
      primitive: protocol
      usage: tls
      confidence: 0.9
      language: php

  - id: enqrypta.misuse.php.weak-kdf
    languages: [php]
    severity: ERROR
    message: The password hashing or key derivation is too weak; use password_hash() with PASSWORD_ARGON2ID or PASSWORD_BCRYPT (cost >= 10), or hash_pbkdf2('sha256', ...) with at least 600000 iterations.
    paths:
      exclude: ["wp-includes/", "wp-admin/", "*.blade.php"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $FN($ALGO, ...)
              - pattern: "$FN(..., algo: $ALGO, ...)"
          - metavariable-regex: {metavariable: $FN, regex: '(?i)^\\?hash_pbkdf2$'}
          - metavariable-pattern: {metavariable: $ALGO, pattern: '"=~/(?i)^(md[245]|sha-?1)$/"'}
      - patterns:
          - pattern-either:
              - pattern: $FN($ALGO, $PASSWORD, $SALT, $ITERATIONS, ...)
              - pattern: "$FN(..., iterations: $ITERATIONS, ...)"
          - metavariable-regex: {metavariable: $FN, regex: '(?i)^\\?hash_pbkdf2$'}
          - metavariable-comparison: {metavariable: $ITERATIONS, comparison: int($ITERATIONS) < 100000}
      - patterns:
          - pattern: $FN($PASSWORD, $ALGO, [..., 'cost' => $COST, ...])
          - metavariable-regex: {metavariable: $FN, regex: '(?i)^\\?password_hash$'}
          - metavariable-comparison: {metavariable: $COST, comparison: int($COST) < 10}
      # crypt() with MD5-crypt ($1$), standard DES (2-character salt) or extended DES (_) salts.
      - patterns:
          - pattern: $FN($PASSWORD, $SALT)
          - metavariable-regex: {metavariable: $FN, regex: '(?i)^\\?crypt$'}
          - metavariable-pattern: {metavariable: $SALT, pattern: '"=~/^(\$1\$|_|[.\/0-9A-Za-z]{2}$)/"'}
    metadata:
      enqrypta_rule_id: enqrypta.misuse.php.weak-kdf
      finding_kind: misuse
      cwe: CWE-916
      algorithm: KDF
      primitive: kdf
      usage: hash
      confidence: 0.9
      language: php

  - id: enqrypta.misuse.php.weak-password-hash
    languages: [php]
    severity: ERROR
    message: A password is hashed with a fast unsalted hash; use password_hash($password, PASSWORD_DEFAULT) and password_verify().
    paths:
      exclude: ["wp-includes/", "wp-admin/", "*.blade.php"]
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $FN(<... $PW ...>, ...)
              - metavariable-regex: {metavariable: $FN, regex: '(?i)^\\?(md5|sha1|crc32)$'}
          - patterns:
              - pattern: $FN($ALGO, <... $PW ...>, ...)
              - metavariable-regex: {metavariable: $FN, regex: '(?i)^\\?hash$'}
      - metavariable-regex:
          metavariable: $PW
          regex: '(?i)^(\$\w+->|\$)?(\w*_)?(password|passwd|pwd|pass)(_\w*)?$'
    metadata:
      enqrypta_rule_id: enqrypta.misuse.php.weak-password-hash
      finding_kind: misuse
      cwe: CWE-916
      algorithm: PASSWORD-HASH
      primitive: hash
      usage: hash
      confidence: 0.85
      language: php

  - id: enqrypta.misuse.php.hardcoded-salt
    languages: [php]
    severity: WARNING
    message: A constant salt lets attackers precompute password guesses; generate a random salt per password (password_hash() does this for you).
    paths:
      exclude: ["wp-includes/", "wp-admin/", "*.blade.php"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $FN($ALGO, $PASSWORD, "...", ...)
              - pattern: "$FN(..., salt: \"...\", ...)"
          - pattern-not: $FN($ALGO, $PASSWORD, "", ...)
          - metavariable-regex: {metavariable: $FN, regex: '(?i)^\\?hash_pbkdf2$'}
      - patterns:
          - pattern: $FN($LENGTH, $PASSWORD, "...", ...)
          - pattern-not: $FN($LENGTH, $PASSWORD, "", ...)
          - metavariable-regex: {metavariable: $FN, regex: '(?i)^\\?sodium_crypto_pwhash$'}
      - patterns:
          - pattern: $FN($PASSWORD, "...")
          - pattern-not: $FN($PASSWORD, "")
          - metavariable-regex: {metavariable: $FN, regex: '(?i)^\\?crypt$'}
      - patterns:
          - pattern: $FN($PASSWORD, $ALGO, [..., 'salt' => $SALT, ...])
          - metavariable-regex: {metavariable: $FN, regex: '(?i)^\\?password_hash$'}
    metadata:
      enqrypta_rule_id: enqrypta.misuse.php.hardcoded-salt
      finding_kind: misuse
      cwe: CWE-760
      algorithm: SALT
      primitive: kdf
      usage: hash
      confidence: 0.85
      language: php

  - id: enqrypta.misuse.php.short-random-token
    languages: [php]
    severity: ERROR
    message: A random token shorter than 16 bytes (128 bits) can be guessed; generate at least 16 bytes, 32 for long-lived tokens.
