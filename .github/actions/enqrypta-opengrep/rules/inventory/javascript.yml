# JavaScript/TypeScript crypto inventory: Node crypto and WebCrypto (subtle).
rules:
  - id: enqrypta.crypto.javascript.aes-cipher
    languages: [javascript, typescript]
    severity: INFO
    message: AES usage inventoried for PQC migration analysis.
    patterns:
      - pattern-either:
          - pattern: $CRYPTO.createCipheriv($CIPHER, ...)
          - pattern: $CRYPTO.createDecipheriv($CIPHER, ...)
          - pattern: createCipheriv($CIPHER, ...)
          - pattern: createDecipheriv($CIPHER, ...)
      - metavariable-regex:
          metavariable: $CIPHER
          regex: (?i)^['"`]aes-
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.aes-cipher
      algorithm: AES
      primitive: symmetric
      usage: encryption
      confidence: 0.95
      language: javascript
      parameters: [mode, key_size_bits]

  - id: enqrypta.crypto.javascript.rsa-keygen
    languages: [javascript, typescript]
    severity: WARNING
    message: RSA key generation requires PQC migration review.
    pattern-either:
      - pattern: '$CRYPTO.generateKeyPair("rsa", {..., modulusLength: $KEY_SIZE, ...}, ...)'
      - pattern: '$CRYPTO.generateKeyPairSync("rsa", {..., modulusLength: $KEY_SIZE, ...}, ...)'
      - patterns:
          - pattern-either:
              - pattern: $CRYPTO.generateKeyPair("rsa", ...)
              - pattern: $CRYPTO.generateKeyPairSync("rsa", ...)
          - pattern-not: '$CRYPTO.$FUNC("rsa", {..., modulusLength: $ANY, ...}, ...)'
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.rsa-keygen
      algorithm: RSA
      primitive: asymmetric
      usage: unknown
      confidence: 0.95
      language: javascript
      parameters: [key_size_bits]

  - id: enqrypta.crypto.javascript.rsa-sign
    languages: [javascript, typescript]
    severity: WARNING
    message: RSA signatures require PQC signature migration.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $CRYPTO.createSign($ALGORITHM, ...)
              - pattern: $CRYPTO.createVerify($ALGORITHM, ...)
          - metavariable-regex:
              metavariable: $ALGORITHM
              regex: (?i)^['"`]RSA-SHA(224|256|384|512)['"`]$
      - pattern: $CRYPTO.generateKeyPair("rsa-pss", ...)
      - pattern: $CRYPTO.generateKeyPairSync("rsa-pss", ...)
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.rsa-sign
      algorithm: RSA
      primitive: signature
      usage: signing
      confidence: 0.95
      language: javascript

  - id: enqrypta.crypto.javascript.rsa-encrypt
    languages: [javascript, typescript]
    severity: WARNING
    message: RSA encryption requires PQC key-establishment migration.
    pattern-either:
      - pattern: $CRYPTO.publicEncrypt(...)
      - pattern: $CRYPTO.privateDecrypt(...)
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.rsa-encrypt
      algorithm: RSA
      primitive: asymmetric
      usage: encryption
      confidence: 0.95
      language: javascript

  - id: enqrypta.crypto.javascript.ecdh
    languages: [javascript, typescript]
    severity: WARNING
    message: ECDH key agreement requires PQC key-establishment migration.
    pattern: $CRYPTO.createECDH($CURVE)
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.ecdh
      algorithm: ECDH
      primitive: key_establishment
      usage: key_establishment
      confidence: 0.95
      language: javascript
      parameters: [parameter_set]

  - id: enqrypta.crypto.javascript.dh
    languages: [javascript, typescript]
    severity: WARNING
    message: Finite-field Diffie-Hellman requires PQC key-establishment migration.
    pattern-either:
      - pattern: $CRYPTO.createDiffieHellman(...)
      - pattern: $CRYPTO.getDiffieHellman(...)
      - pattern: $CRYPTO.generateKeyPairSync("dh", ...)
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.dh
      algorithm: DH
      primitive: key_establishment
      usage: key_establishment
      confidence: 0.95
      language: javascript

  - id: enqrypta.crypto.javascript.ed25519
    languages: [javascript, typescript]
    severity: WARNING
    message: Ed25519 signatures require PQC signature migration.
    pattern-either:
      - pattern: $CRYPTO.generateKeyPair("ed25519", ...)
      - pattern: $CRYPTO.generateKeyPairSync("ed25519", ...)
      - patterns:
          - pattern-either:
              - pattern: '$SUBTLE.generateKey({..., name: $NAME, ...}, ...)'
              - pattern: '$SUBTLE.generateKey($NAME, ...)'
          - metavariable-regex:
              metavariable: $NAME
              regex: ^['"`]Ed25519['"`]$
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.ed25519
      algorithm: ED25519
      primitive: signature
      usage: signing
      confidence: 0.95
      language: javascript
      parameter_set: Ed25519

  - id: enqrypta.crypto.javascript.x25519
    languages: [javascript, typescript]
    severity: WARNING
    message: X25519 key agreement requires PQC key-establishment migration.
    pattern-either:
      - pattern: $CRYPTO.generateKeyPair("x25519", ...)
      - pattern: $CRYPTO.generateKeyPairSync("x25519", ...)
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.x25519
      algorithm: X25519
      primitive: key_establishment
      usage: key_establishment
      confidence: 0.95
      language: javascript
      parameter_set: X25519

  - id: enqrypta.crypto.javascript.webcrypto-rsa-encrypt
    languages: [javascript, typescript]
    severity: WARNING
    message: RSA-OAEP encryption requires PQC key-establishment migration.
    patterns:
      - pattern-either:
          - pattern: '$SUBTLE.generateKey({..., name: "RSA-OAEP", ...}, ...)'
          - pattern: '$SUBTLE.importKey($FORMAT, $KEY, {..., name: "RSA-OAEP", ...}, ...)'
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.webcrypto-rsa-encrypt
      algorithm: RSA
      primitive: asymmetric
      usage: encryption
      confidence: 0.95
      language: javascript
      padding: OAEP

  - id: enqrypta.crypto.javascript.webcrypto-rsa-sign
    languages: [javascript, typescript]
    severity: WARNING
    message: RSA signatures require PQC signature migration.
    patterns:
      - pattern-either:
          - pattern: '$SUBTLE.generateKey({..., name: $NAME, ...}, ...)'
          - pattern: '$SUBTLE.importKey($FORMAT, $KEY, {..., name: $NAME, ...}, ...)'
      - metavariable-regex:
          metavariable: $NAME
          regex: ^['"`](RSASSA-PKCS1-v1_5|RSA-PSS)['"`]$
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.webcrypto-rsa-sign
      algorithm: RSA
      primitive: signature
      usage: signing
      confidence: 0.95
      language: javascript

  - id: enqrypta.crypto.javascript.webcrypto-ecdsa
    languages: [javascript, typescript]
    severity: WARNING
    message: ECDSA signatures require PQC signature migration.
    pattern-either:
      - pattern: '$SUBTLE.generateKey({..., name: "ECDSA", ...}, ...)'
      - pattern: '$SUBTLE.importKey($FORMAT, $KEY, {..., name: "ECDSA", ...}, ...)'
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.webcrypto-ecdsa
      algorithm: ECDSA
      primitive: signature
      usage: signing
      confidence: 0.95
      language: javascript

  - id: enqrypta.crypto.javascript.webcrypto-ecdh
    languages: [javascript, typescript]
    severity: WARNING
    message: ECDH key agreement requires PQC key-establishment migration.
    pattern-either:
      - pattern: '$SUBTLE.generateKey({..., name: "ECDH", ...}, ...)'
      - pattern: '$SUBTLE.importKey($FORMAT, $KEY, {..., name: "ECDH", ...}, ...)'
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.webcrypto-ecdh
      algorithm: ECDH
      primitive: key_establishment
      usage: key_establishment
      confidence: 0.95
      language: javascript

  - id: enqrypta.crypto.javascript.webcrypto-aes
    languages: [javascript, typescript]
    severity: INFO
    message: AES usage inventoried for PQC migration analysis.
    patterns:
      - pattern-either:
          - pattern: '$SUBTLE.generateKey({..., name: $CIPHER, ...}, ...)'
          - pattern: '$SUBTLE.importKey($FORMAT, $KEY, {..., name: $CIPHER, ...}, ...)'
          - pattern: '$SUBTLE.importKey($FORMAT, $KEY, $CIPHER, ...)'
      - metavariable-regex:
          metavariable: $CIPHER
          regex: ^['"`]AES-(GCM|CBC|CTR|KW)['"`]$
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.webcrypto-aes
      algorithm: AES
      primitive: symmetric
      usage: encryption
      confidence: 0.95
      language: javascript

  - id: enqrypta.crypto.javascript.sha1
    languages: [javascript, typescript]
    severity: ERROR
    message: SHA-1 is deprecated and requires replacement.
    patterns:
      - pattern-either:
          - pattern: $CRYPTO.createHash($ALGORITHM, ...)
          - pattern: createHash($ALGORITHM, ...)
          - pattern: $SUBTLE.digest($ALGORITHM, ...)
      - metavariable-regex:
          metavariable: $ALGORITHM
          regex: (?i)^['"`]sha-?1['"`]$
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.sha1
      algorithm: SHA-1
      primitive: hash
      usage: hash
      confidence: 0.95
      language: javascript

  - id: enqrypta.crypto.javascript.md5
    languages: [javascript, typescript]
    severity: ERROR
    message: MD5 is deprecated and requires replacement.
    patterns:
      - pattern-either:
          - pattern: $CRYPTO.createHash($ALGORITHM, ...)
          - pattern: createHash($ALGORITHM, ...)
      - metavariable-regex:
          metavariable: $ALGORITHM
          regex: (?i)^['"`]md5['"`]$
    metadata:
      enqrypta_rule_id: enqrypta.crypto.javascript.md5
      algorithm: MD5
      primitive: hash
      usage: hash
      confidence: 0.95
      language: javascript
